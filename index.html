<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cutline — Browser Video Editor</title>
  <style>
    :root{color-scheme:dark;--ink:#090a0c;--panel:#101216;--line:#ffffff1a;--accent:#ff6542;--text:#f6f4ef;--muted:#ffffff73}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:14px Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.35}header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 24px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:#090a0c;font-size:18px}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.export{min-height:40px;border:0;border-radius:12px;background:var(--text);color:#08090b;font-weight:700;padding:0 15px}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 64px)}.editor{display:flex;min-width:0;flex-direction:column}.stage{min-height:440px;flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:radial-gradient(circle,#24272c 0,#111318 52%,#090a0c 100%)}video{max-width:100%;max-height:58vh;background:#000;border-radius:6px;box-shadow:0 25px 70px #0008}.drop{width:min(680px,100%);min-height:260px;display:grid;place-items:center;text-align:center;border:1px dashed #ffffff33;border-radius:18px;background:#ffffff08;padding:28px}.drop:hover{border-color:var(--accent)}.drop .icon{font-size:28px;color:#ff8065}.drop b{font-size:18px}.drop span{color:var(--muted);margin-top:-20px}.timeline{border-top:1px solid var(--line);background:var(--panel);padding:18px 20px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.transport{display:flex;align-items:center;gap:8px}.control{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:17px}.control:hover{background:#ffffff14;color:white}.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#08090b;font-size:18px}.time{font-family:monospace;background:#0005;border-radius:8px;padding:9px 11px}.reset{border:0;background:transparent;color:var(--muted)}.track{position:relative;height:92px;overflow:hidden;margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#191c21}.wave{position:absolute;inset:0;display:flex;align-items:center;gap:3px;padding:8px;opacity:.48}.wave i{flex:1;height:52px;background:linear-gradient(#a9b8c8,#46515e);border-radius:2px}.selection{position:absolute;top:0;bottom:0;background:#ff65421c;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}.head{position:absolute;top:0;bottom:0;width:1px;background:white;box-shadow:0 0 8px white}.head:after{content:"";position:absolute;top:0;left:-5px;width:11px;height:11px;background:white;transform:rotate(45deg)}.seek{position:absolute;inset:0;width:100%;opacity:0}.rangegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}label{display:grid;gap:8px;color:var(--muted);font-size:12px}label span{display:flex;justify-content:space-between}label b{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent)}aside{border-left:1px solid var(--line);padding:20px;background:#0d0f12}.eyebrow{font-size:11px;color:#ffffff65;font-weight:700;text-transform:uppercase;letter-spacing:.16em}.import{width:100%;min-height:44px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a;color:var(--text);font-weight:600}.card{border:1px solid var(--line);border-radius:12px;background:#ffffff07;padding:14px}.file{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{color:var(--muted);font-size:12px;line-height:1.5}.notice{margin-top:20px;border-radius:12px;background:#ff65421c;color:#ffb09e;padding:14px}.notice b{display:block;margin-bottom:5px}@media(max-width:760px){header{padding:0 14px}main{grid-template-columns:1fr}aside{display:none}.stage{min-height:360px;padding:20px}.rangegrid{grid-template-columns:1fr 1fr}.timeline{padding:14px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">▶</div><div><b>Cutline</b><small>Browser video editor</small></div></div><button class="export" id="export" disabled>⇩ Export clip</button></header>
  <main><section class="editor"><div class="stage" id="stage"><button class="drop" id="drop"><div class="icon">↥</div><b>Drop a video here</b><span>or click to choose a file from your device</span></button><video id="video" hidden playsinline></video></div><div class="timeline"><div class="controls"><div class="transport"><button class="control" id="back" disabled>↶</button><button class="play" id="play" disabled>▶</button><button class="control" id="forward" disabled>↷</button></div><div class="time"><span id="now">00:00.0</span> <span style="color:#ffffff55">/ <span id="total">00:00.0</span></span></div><button class="reset" id="reset" disabled>↺ Reset trim</button></div><div class="track"><div class="wave" id="wave"></div><div class="selection" id="selection"></div><div class="head" id="head"></div><input class="seek" id="seek" type="range" min="0" max="1" step=".05" value="0" disabled></div><div class="rangegrid"><label><span>In <b id="inLabel">00:00.0</b></span><input id="in" type="range" min="0" max="1" step=".05" value="0" disabled></label><label><span>Out <b id="outLabel">00:00.0</b></span><input id="out" type="range" min="0" max="1" step=".05" value="0" disabled></label></div></div></section><aside><div class="eyebrow">Media</div><button class="import" id="import">↥ Import video</button><div class="card"><div class="file" id="file">No clip loaded</div><p class="hint" id="info">MP4, WebM, MOV</p><p class="hint" id="status">Import a video to begin editing</p></div><div class="notice"><b>✂ Selection</b><span id="selectionInfo">Your selected range will be exported as WebM.</span></div></aside></main>
  <input id="input" type="file" accept="video/*" hidden>
  <script>
    const $=id=>document.getElementById(id), video=$('video'), input=$('input'), fmt=n=>!isFinite(n)?'00:00.0':String(Math.floor(n/60)).padStart(2,'0')+':'+(n%60).toFixed(1).padStart(4,'0');
    let duration=0,start=0,end=0,src='';
    for(let i=0;i<36;i++){let b=document.createElement('i');b.style.opacity=.35+(i%6)*.1;$('wave').append(b)}
    const active=on=>['play','back','forward','reset','export','seek','in','out'].forEach(id=>$(id).disabled=!on);
    const seek=n=>{n=Math.max(0,Math.min(duration,n));video.currentTime=n;$('seek').value=n;$('now').textContent=fmt(n);paint()};
    const paint=()=>{let l=duration?start/duration*100:0,w=duration?(end-start)/duration*100:100,h=duration?video.currentTime/duration*100:0;$('selection').style.left=l+'%';$('selection').style.width=w+'%';$('head').style.left=h+'%';$('inLabel').textContent=fmt(start);$('outLabel').textContent=fmt(end);$('selectionInfo').textContent=fmt(Math.max(0,end-start))+' will be exported as a WebM clip.'};
    const load=f=>{if(!f)return;if(src)URL.revokeObjectURL(src);src=URL.createObjectURL(f);video.src=src;video.hidden=false;$('drop').hidden=true;$('file').textContent=f.name;$('status').textContent='Clip ready — drag the trim handles to shape your cut'};
    $('drop').onclick=()=>$('input').click();$('import').onclick=()=>$('input').click();input.onchange=e=>load(e.target.files[0]);
    video.onloadedmetadata=()=>{duration=video.duration;start=0;end=duration;['seek','in','out'].forEach(id=>$(id).max=duration);$('out').value=end;$('total').textContent=fmt(duration);active(true);paint()};
    video.ontimeupdate=()=>{if(video.currentTime>=end){video.pause()}$('now').textContent=fmt(video.currentTime);paint()};video.onplay=()=>$('play').textContent='❚❚';video.onpause=()=>$('play').textContent='▶';
    $('play').onclick=()=>{if(video.paused){if(video.currentTime<start||video.currentTime>=end)seek(start);video.play()}else video.pause()};$('back').onclick=()=>seek(start);$('forward').onclick=()=>seek(Math.min(end,video.currentTime+5));$('reset').onclick=()=>{start=0;end=duration;$('in').value=0;$('out').value=end;paint()};$('seek').oninput=e=>seek(+e.target.value);$('in').oninput=e=>{start=Math.min(+e.target.value,end-.1);$('in').value=start;seek(start)};$('out').oninput=e=>{end=Math.max(+e.target.value,start+.1);$('out').value=end;paint()};
    $('export').onclick=async()=>{if(!video.captureStream){$('status').textContent='WebM export needs Chrome, Edge, or another Chromium-based browser.';return}$('export').textContent='Exporting…';video.pause();const old=video.currentTime;seek(start);await new Promise(r=>video.addEventListener('seeked',r,{once:true}));try{const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',rec=new MediaRecorder(video.captureStream(),{mimeType:type}),parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start(250);await video.play();await new Promise(r=>{const w=()=>video.currentTime>=end||video.ended?r():requestAnimationFrame(w);w()});video.pause();rec.stop();await done;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type}));a.download=($('file').textContent.replace(/\.[^.]+$/,'')||'cutline')+'-trimmed.webm';a.click();$('status').textContent='Export complete — your trimmed clip was downloaded'}catch(e){$('status').textContent='Export could not finish. Try a shorter selection.'}finally{seek(old);$('export').textContent='⇩ Export clip'}};
  </script>
</body>
</html>
